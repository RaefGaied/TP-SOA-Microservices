<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Kafka</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4 text-center">💬 Dashboard Kafka</h1>
    
    <div class="card mb-4">
        <div class="card-body">
      
          <div class="mb-4">
            <label class="form-label fw-bold">Mode d'envoi :</label>
            <select id="mode-select" class="form-select w-50">
              <option value="manual">📥 Manuel</option>
              <option value="auto">⚙️ Automatique</option>
            </select>
          </div>
  

          <form id="message-form" class="mb-4">
            <div class="input-group">
              <input type="text" class="form-control" id="message-input" placeholder="Entrez un message" required />
              <button class="btn btn-primary" type="submit">Envoyer</button>
            </div>
          </form>
  
       
          <div id="auto-status" class="text-muted mb-3"></div>
        </div>
      </div>
  
      <div class="card">
        <div class="card-header">
          <h3 class="mb-0">📜 Liste des messages (Kafka → PostgreSQL)</h3>
        </div>
        <div class="card-body p-0">
          <ul class="list-group list-group-flush" id="messages-list">
            <li class="list-group-item text-center text-muted">Chargement des messages...</li>
          </ul>
        </div>
      </div>
    </div>
  

    <script src="./js/script.js" defer></script>
</body>
</html>
